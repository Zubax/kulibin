## Maximum-verification CI for float/: every simulation testbench, every algebraic property test, every
## formal-equivalence proof under float/proof/, and the full parameter-sweep coverage closure. Slow, so it runs only
## on pushes that modify float/ AND are either on `main` or carry the "#ci-float" marker in the commit message. The
## cheap `verify.yml` workflow gates every PR.
##
## The maximum suite is split across jobs because GitHub caps a single job at 6h. The final `verify-deep` job aggregates
## the split jobs, preserving one high-level check while keeping each shard under the timeout.

name: verify-deep

on:
  push:
    # Everything this workflow runs is float/ verification, so don't spend hours of CI on pushes that
    # don't touch it. The per-job main-branch / #ci-float gate below still applies on top of this.
    paths:
      - 'float/**'
  # Manual trigger, so the deep suite can be run on demand (and changes to this workflow itself can be
  # tested) without a float/ push: `gh workflow run verify-deep.yml --ref <branch>`.
  workflow_dispatch:

jobs:
  verify-base:
    if: |
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '#ci-float')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zubax/zubax-fpga-toolchain:2026-05-20
      options: --user root      # See verify.yml for why root is needed.
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6

      - name: Enable parallel matrix (best-effort)
        continue-on-error: true
        run: python3 -m pip install --no-input --break-system-packages pytest-xdist || python3 -m pip install --no-input pytest-xdist

      - name: Lint
        run: make lint

      - name: Run baseline verification
        run: make verify FLOAT_PRUNE_BUILDS=1

      - name: Upload baseline coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: float-baseline-coverage-report
          path: build/float/coverage/
          retention-days: 30

  float-extended-icarus:
    if: |
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '#ci-float')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zubax/zubax-fpga-toolchain:2026-05-20
      options: --user root
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6

      - name: Enable parallel matrix (best-effort)
        continue-on-error: true
        run: python3 -m pip install --no-input --break-system-packages pytest-xdist || python3 -m pip install --no-input pytest-xdist

      - name: Run extended Icarus sweep
        run: make verify-float-extended-icarus FLOAT_PRUNE_BUILDS=1

  float-extended-verilator:
    if: |
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '#ci-float')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zubax/zubax-fpga-toolchain:2026-05-20
      options: --user root
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6

      - name: Enable parallel matrix (best-effort)
        continue-on-error: true
        run: python3 -m pip install --no-input --break-system-packages pytest-xdist || python3 -m pip install --no-input pytest-xdist

      - name: Run extended Verilator sweep
        run: make verify-float-extended-verilator FLOAT_PRUNE_BUILDS=1

      - name: Run full coverage gate
        run: make coverage-float-gate-full

      - name: Upload Verilator coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: float-coverage-report
          path: build/float/coverage-full/
          retention-days: 30

  float-properties:
    if: |
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '#ci-float')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zubax/zubax-fpga-toolchain:2026-05-20
      options: --user root
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6

      - name: Enable parallel matrix (best-effort)
        continue-on-error: true
        run: python3 -m pip install --no-input --break-system-packages pytest-xdist || python3 -m pip install --no-input pytest-xdist

      - name: Run algebraic properties
        run: make verify-float-properties FLOAT_PRUNE_BUILDS=1

  float-accuracy:
    if: |
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '#ci-float')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zubax/zubax-fpga-toolchain:2026-05-20
      options: --user root
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6

      - name: Enforce transcendental/trig <= 1 ULP faithful-rounding contract (reference vs mpmath _true oracle)
        run: make verify-float-accuracy

  float-formal:
    if: |
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '#ci-float')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zubax/zubax-fpga-toolchain:2026-05-20
      options: --user root
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6

      - name: Run formal proofs
        run: make formal-float

      - name: Upload formal verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: float-formal-report
          path: |
            build/float/formal/report.html
            build/float/formal/summary.json
            build/float/formal/**/trace.vcd
          retention-days: 30

  # Optional Yosys + nextpnr-xilinx Spartan-7 (xc7s50) synthesis. Non-fatal by design
  # (continue-on-error): it runs and uploads its report but never gates a push.
  spartan7-synth:
    if: |
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '#ci-float')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zubax/zubax-fpga-toolchain:2026-05-20
      options: --user root
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6

      - name: Cache Spartan-7 chip database
        uses: actions/cache@v4
        with:
          path: build/float_synth_yosys_spartan7/chipdb
          key: spartan7-chipdb-2026-05-20-xc7s50csga324-1

      - name: Run Spartan-7 synthesis (optional, non-fatal)
        continue-on-error: true
        timeout-minutes: 120
        run: make synth-float-yosys-spartan7

      - name: Upload Spartan-7 synthesis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: float-spartan7-report
          path: |
            build/float_synth_yosys_spartan7/index.html
            build/float_synth_yosys_spartan7/**/nextpnr.log
            build/float_synth_yosys_spartan7/**/yosys.log
            build/float_synth_yosys_spartan7/chipdb/*_build.log
          retention-days: 30

  verify-deep:
    if: |
      always() && (
        github.ref == 'refs/heads/main' ||
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.head_commit.message, '#ci-float')
      )
    needs:
      - verify-base
      - float-extended-icarus
      - float-extended-verilator
      - float-properties
      - float-accuracy
      - float-formal
    runs-on: ubuntu-latest
    steps:
      - name: Check split deep verification jobs
        run: |
          test '${{ needs.verify-base.result }}' = 'success'
          test '${{ needs.float-extended-icarus.result }}' = 'success'
          test '${{ needs.float-extended-verilator.result }}' = 'success'
          test '${{ needs.float-properties.result }}' = 'success'
          test '${{ needs.float-accuracy.result }}' = 'success'
          test '${{ needs.float-formal.result }}' = 'success'
