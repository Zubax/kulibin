## Maximum-verification CI: every simulation testbench, every algebraic property test, every
## formal-equivalence proof under float/proof/, and the full parameter-sweep coverage closure
## (verify-float-extended + coverage-float-gate-full). Slow (a few hours wall-clock on the Zubax
## toolchain container), so it runs only on commits pushed to `main` or commits whose message
## includes the "#ci-float" marker. The cheap `verify.yml` workflow continues to gate every PR.

name: verify-deep

on:
  push:

jobs:
  verify-deep:
    if: |
      github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, '#ci-float')
    runs-on: ubuntu-latest
    container:
      # 2026-05-20 bundles sby/yices2/bitwuzla plus nextpnr-xilinx (openXC7 fork) with Spartan-7
      # support, so nothing else needs installing in the job. Bump this date when the image updates.
      image: ghcr.io/zubax/zubax-fpga-toolchain:2026-05-20
      # See verify.yml for why root is needed.
      options: --user root
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v6

      - name: Lint
        run: make lint

      - name: Run maximum verification
        run: make verify-deep

      # Optional Yosys + nextpnr-xilinx Spartan-7 (xc7s50) synthesis. The toolchain image bundles
      # nextpnr-xilinx, bbasm, and the prjxray-db / nextpnr-xilinx-meta submodules under
      # /opt/nextpnr-xilinx, so the chip database builds with no extra checkout. That build takes a
      # few minutes, so cache it; it is keyed on the image tag because the database is not portable
      # across nextpnr-xilinx versions. These steps run with `if: always()` so the Spartan flow is
      # exercised and its report produced even when the upstream verification step fails, and they are
      # non-fatal by design (the script never exits nonzero, continue-on-error guards a hard crash), so
      # they never gate a push. The synth step also has its own timeout-minutes: openXC7 P&R can run for
      # hours, and without a step-level cap a slow synth would burn the whole job's budget and trip the
      # JOB-level timeout (which overrides continue-on-error), turning a passing verification run red.
      - name: Cache Spartan-7 chip database
        if: always()
        uses: actions/cache@v4
        with:
          path: build/float_synth_yosys_spartan7/chipdb
          key: spartan7-chipdb-2026-05-20-xc7s50csga324-1

      - name: Run Spartan-7 synthesis (optional, non-fatal)
        if: always()
        continue-on-error: true
        timeout-minutes: 75
        run: make synth-float-yosys-spartan7

      - name: Upload Spartan-7 synthesis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: float-spartan7-report
          path: |
            build/float_synth_yosys_spartan7/index.html
            build/float_synth_yosys_spartan7/**/nextpnr.log
            build/float_synth_yosys_spartan7/**/yosys.log
            build/float_synth_yosys_spartan7/chipdb/*_build.log
          retention-days: 30

      - name: Upload formal verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: float-formal-report
          path: |
            build/float/formal/report.html
            build/float/formal/summary.json
            build/float/formal/**/trace.vcd
          retention-days: 30

      - name: Upload Verilator coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: float-coverage-report
          path: build/float/coverage/
          retention-days: 30
