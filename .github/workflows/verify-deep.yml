## Maximum-verification CI: every simulation testbench, every algebraic property test, every
## formal-equivalence proof under float/proof/, and the full parameter-sweep coverage closure
## (verify-float-extended + coverage-float-gate-full). Slow (a few hours wall-clock on the Zubax
## toolchain container), so it runs only on pushes that modify float/ AND are either on `main` or
## carry the "#ci-float" marker in the commit message. The cheap `verify.yml` workflow gates every PR.

name: verify-deep

on:
  push:
    # Everything this workflow runs is float/ verification, so don't spend hours of CI on pushes that
    # don't touch it. The job's main-branch / #ci-float gate below still applies on top of this.
    paths:
      - 'float/**'

jobs:
  verify-deep:
    if: |
      github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, '#ci-float')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zubax/zubax-fpga-toolchain:2026-05-20
      options: --user root      # See verify.yml for why root is needed.
    timeout-minutes: 360        # This is a very long-running job so we need maximum timeout.

    steps:
      - uses: actions/checkout@v6

      - name: Lint
        run: make lint

      - name: Run maximum verification
        run: make verify-deep

      # Optional Yosys + nextpnr-xilinx Spartan-7 (xc7s50) synthesis. The toolchain image bundles nextpnr-xilinx,
      # bbasm, and the prjxray-db / nextpnr-xilinx-meta submodules, so the chip database builds with no extra checkout.
      # That build takes a few minutes, so cache it; it is keyed on the image tag because the database is not portable
      # across nextpnr-xilinx versions. These steps run with `if: always()` so the Spartan flow is exercised and its
      # report produced even when the upstream verification step fails, and they are non-fatal by design (the script
      # never exits nonzero, continue-on-error guards a hard crash), so they never gate a push.
      - name: Cache Spartan-7 chip database
        if: always()
        uses: actions/cache@v4
        with:
          path: build/float_synth_yosys_spartan7/chipdb
          key: spartan7-chipdb-2026-05-20-xc7s50csga324-1

      - name: Run Spartan-7 synthesis (optional, non-fatal)
        if: always()
        continue-on-error: true
        run: make synth-float-yosys-spartan7

      - name: Upload Spartan-7 synthesis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: float-spartan7-report
          path: |
            build/float_synth_yosys_spartan7/index.html
            build/float_synth_yosys_spartan7/**/nextpnr.log
            build/float_synth_yosys_spartan7/**/yosys.log
            build/float_synth_yosys_spartan7/chipdb/*_build.log
          retention-days: 30

      - name: Upload formal verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: float-formal-report
          path: |
            build/float/formal/report.html
            build/float/formal/summary.json
            build/float/formal/**/trace.vcd
          retention-days: 30

      - name: Upload Verilator coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: float-coverage-report
          path: build/float/coverage/
          retention-days: 30
